# Tier -> model map. Skills name a tier, never a model.
# Per-machine overrides (e.g. a work model set) go in models.local.toml next to
# this file; it is gitignored and deep-merged over this one, key by key.
#
# Harness keys:
#   claude-code  alias or full model id (aliases float to the latest model)
#   claude-ui    display name; advisory only, the UI can't pin a model per skill
#   opencode     provider/model-id
#   zed          { provider, model }

[tiers.fast]
description = "quick and cheap: commit messages, summaries, routing, formatting"
claude-code = "sonnet"
claude-ui   = "Sonnet"
opencode    = "anthropic/claude-sonnet-5-5"
zed         = { provider = "anthropic", model = "claude-sonnet-5-5" }

[tiers.balanced]
description = "everyday coding, explaining, refactoring"
claude-code = "opus"
claude-ui   = "Opus"
opencode    = "anthropic/claude-opus-5-5"
zed         = { provider = "anthropic", model = "claude-opus-5-5" }

[tiers.deep]
description = "review, planning, hard debugging"
claude-code = "fable"
claude-ui   = "Fable"
opencode    = "anthropic/claude-fable-5-1"
zed         = { provider = "anthropic", model = "claude-fable-5-1" }

# Helper agents declared by skills via `agents: [...]` in their frontmatter,
# keyed by agent name. The review skill uses these: `review-quick` is the single
# reviewer for small changes; `review-claude`/`review-gpt`/`review-deepseek` form
# the panel for large, cross-cutting changes. Independence is the point, so the
# opencode panel is cross-vendor. Harnesses that can only run Anthropic models
# (claude-code, zed) map reviewers to Anthropic models, and the skill warns that
# the panel isn't independent. A reviewer with no entry for a harness is not
# offered there.

[agents.review-quick]
claude-code = "sonnet"
claude-ui   = "Sonnet"
opencode    = "anthropic/claude-sonnet-5-5"
zed         = { provider = "anthropic", model = "claude-sonnet-5-5" }

[agents.review-claude]
claude-code = "opus"
claude-ui   = "Opus"
opencode    = "github-copilot/claude-opus-5"
zed         = { provider = "anthropic", model = "claude-opus-5-5" }

[agents.review-gpt]
claude-code = "sonnet"
claude-ui   = "Sonnet"
opencode    = "github-copilot/gpt-6-sol"
zed         = { provider = "anthropic", model = "claude-sonnet-5-5" }

# No claude-code entry: the deepseek reviewer is not offered there, so the
# claude-code panel is review-claude (opus) + review-gpt (sonnet). zed keeps it
# as a haiku stand-in, giving a three-reviewer panel.
[agents.review-deepseek]
opencode    = "fireworks-ai/accounts/fireworks/models/deepseek-v4p1-flash"
zed         = { provider = "anthropic", model = "claude-haiku-4-5" }
